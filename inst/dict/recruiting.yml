dataset: recruiting
source: CFBD /recruiting/players (per class year, 2010–2026)
grain: one recruited athlete (deduped from the per-class feed)
key: playerId (string, from athleteId)
description: >
  High-school recruiting ratings (industry `stars` 2–5, composite `rating`
  ~0.74–1.0, national `ranking`) keyed by athlete id. New ingestion for the
  recruiting spike (decision 0013). clean_recruiting DROPS recruits with no
  athleteId (~40% of the feed: never enrolled, JUCO/international, or unlinked)
  and DEDUPES to one row per athlete (highest rating, then stars, then most
  recent class). CAVEAT: the recruiting athleteId is NOT a reliable member of
  the shared athlete-id namespace — it collides across different people (e.g.
  Cam Ward's id maps to a different recruit, Xavier Ward), so any join must be
  name-guarded at link time via link_recruiting() (decision 0013). This table
  is the join-ready ratings source, not a validated per-player attribute.
columns:
  - name: playerId
    type: string
    description: Athlete id (from recruiting `athleteId`) coerced to string.
    provenance: derived (clean_recruiting)
  - name: recruit_name
    type: string
    description: >
      Recruit name as reported by the recruiting feed. Retained for the
      link-time name guard (link_recruiting) and QA — may disagree with the
      athlete-id namespace name on a collision.
    provenance: raw (name)
  - name: hs_class
    type: int32
    description: High-school recruiting class year.
    provenance: raw (year)
  - name: stars
    type: int32
    description: Industry star rating (2–5); NA where unrated.
    provenance: raw
  - name: rating
    type: double
    description: >
      Composite rating, a 0–1 index (most rated players ~0.7–1.0, with a tail of
      2-stars dipping lower); NA where unrated. Contract bounds it to [0, 1].
    provenance: raw
  - name: national_rank
    type: int32
    description: National recruit ranking; NA where unranked.
    provenance: raw (ranking)
  - name: recruit_position
    type: string
    description: Recruiting position.
    provenance: raw (position)
  - name: committed_to
    type: string
    description: >
      School the recruit committed to per the feed. Treat cautiously — can
      reflect a later/updated commitment, not the first college (decision 0013).
    provenance: raw (committedTo)

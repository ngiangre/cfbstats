name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::testthat

      # Runs R CMD check, which executes the testthat suite. The data contracts
      # are exercised by the contract tests on small in-memory fixtures, so this
      # gate needs no CFBD API key or downloaded data.
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
